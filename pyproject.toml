[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tanvelo"
version = "1.0.0"
description = "Universal AI Memory Layer — Phase 1 Hackathon MVP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tanvelo Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
